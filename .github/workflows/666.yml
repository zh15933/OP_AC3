name: 同步上游(自设)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: datout/Openwrt-Auto
  UPSTREAM_BRANCH: main

jobs:
  sync:
    if: github.repository != 'datout/Openwrt-Auto'
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: 备份自定义的 kkk.yml、666.yml 和 trigger.yml
        shell: bash
        run: |
          set -euo pipefail
          for f in "kkk.yml" "666.yml" "trigger.yml"; do
            if [ -f ".github/workflows/$f" ]; then
              cp ".github/workflows/$f" "${RUNNER_TEMP}/${f}.bak"
              echo "已备份 $f"
            fi
          done

      - name: 获取上游最新同步器
        shell: bash
        run: |
          set -euo pipefail
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch upstream "${UPSTREAM_BRANCH}" --prune
          SYNC_SCRIPT="${RUNNER_TEMP}/openwrt-auto-sync-upstream.sh"
          git show "upstream/${UPSTREAM_BRANCH}:common/sync-upstream.sh" > "${SYNC_SCRIPT}"
          chmod +x "${SYNC_SCRIPT}"
          bash -n "${SYNC_SCRIPT}"
          echo "最新同步器已加载：${SYNC_SCRIPT}"

      - name: 执行上游同步
        shell: bash
        run: |
          set -euo pipefail
          bash "${RUNNER_TEMP}/openwrt-auto-sync-upstream.sh"

      - name: 恢复自定义文件并清理不需要的 workflow 和 build 目录
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          HAS_CHANGES=false
          
          # 1. 恢复自定义文件 (kkk, 666, trigger)
          for f in "kkk.yml" "666.yml" "trigger.yml"; do
            if [ -f "${RUNNER_TEMP}/${f}.bak" ]; then
              mkdir -p .github/workflows
              cp "${RUNNER_TEMP}/${f}.bak" ".github/workflows/$f"
              echo "已恢复 $f"
              HAS_CHANGES=true
            fi
          done
          
          # 2. 删除不需要的 workflow 文件
          FILES_TO_DELETE=(
            ".github/workflows/Lienol.yml"
            ".github/workflows/Mt798x.yml"
            ".github/workflows/Official.yml"
            ".github/workflows/Xwrt.yml"
            ".github/workflows/update-adguardhome-api-cache.yml"
            ".github/workflows/validate.yml"
          )
          
          for file in "${FILES_TO_DELETE[@]}"; do
            if [ -f "$file" ]; then
              echo "正在删除文件: $file"
              rm -f "$file"
              HAS_CHANGES=true
            fi
          done
          
          # 3. 删除不需要的 build 目录
          DIRS_TO_DELETE=(
            "build/Lienol"
            "build/Mt798x"
            "build/Official"
            "build/Xwrt"
          )
          
          for dir in "${DIRS_TO_DELETE[@]}"; do
            if [ -d "$dir" ]; then
              echo "正在删除目录: $dir"
              rm -rf "$dir"
              HAS_CHANGES=true
            fi
          done
          
          # 3.5 同步后恢复本 Fork 的定制：移除不需要的上游步骤（其余上游更新保留）
          #     - 「⚠️ 上游更新提示（不阻断编译）」：本 Fork 不需要该提示
          #     - 「生成 ESXi VMDK」：本 Fork 不产出 combined-efi.img.gz，该步骤必然失败
          prune_step() {
            local file="$1" name="$2" start end tmp="${1}.prune.tmp"
            [[ -f "$file" ]] || return 1
            start="$(grep -nF -- "- name: ${name}" "$file" | head -n1 | cut -d: -f1 || true)"
            [[ -n "${start}" ]] || return 1
            end=""
            while IFS=: read -r ln _; do
              if (( ln > start )); then end="${ln}"; break; fi
            done < <(grep -n '^    - name:' "$file" || true)
            if [[ -z "${end}" ]]; then
              end="$(( $(wc -l < "$file") + 1 ))"
            fi
            cp "$file" "$tmp"
            sed -i "${start},$(( end - 1 ))d" "$tmp"
            if (( $(grep -c '^    - name:' "$tmp" || true) < 5 )); then
              rm -f "$tmp"
              return 1
            fi
            mv "$tmp" "$file"
            echo "已移除步骤：${name}（${file}）"
            return 0
          }

          for step_name in "⚠️ 上游更新提示（不阻断编译）" "生成 ESXi VMDK"; do
            if prune_step ".github/workflows/compile.yml" "${step_name}"; then
              HAS_CHANGES=true
            else
              echo "未找到步骤（可能上游已改名，跳过）：${step_name}"
            fi
          done

          # 第一阶段 build-entry.sh 的上游更新检测：同步后会被恢复，这里重新注释掉
          if grep -Eq '^[[:space:]]*check_upstream[[:space:]]*$' ".github/scripts/build-entry.sh"; then
            sed -i -E 's|^([[:space:]]*)check_upstream[[:space:]]*$|\1# check_upstream   # 由 666.yml 自动关闭|' ".github/scripts/build-entry.sh"
            echo "已关闭 build-entry.sh 的上游更新检测"
            HAS_CHANGES=true
          fi

          # 4. 提交并推送
          if [ "$HAS_CHANGES" = true ]; then
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: 恢复自定义 workflow，清理无效配置与不需要的上游步骤"
              CURRENT_BRANCH="${GITHUB_REF_NAME:-$(git branch --show-current)}"
              git push origin "HEAD:${CURRENT_BRANCH}"
              echo "清理完成并已推送。"
            else
              echo "文件内容与提交前一致，无需提交。"
            fi
          else
            echo "没有需要恢复或删除的文件。"
          fi

      - name: 上传自定义配置备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-backup
          path: ${{ runner.temp }}/openwrt-auto-sync/custom-backup.tar.gz
          if-no-files-found: ignore
          retention-days: 7