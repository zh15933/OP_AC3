name: 同步上游(自设)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: datout/Openwrt-Auto
  UPSTREAM_BRANCH: main

jobs:
  sync:
    if: github.repository != 'datout/Openwrt-Auto'
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: 备份自定义的 kkk.yml、666.yml 和 trigger.yml
        shell: bash
        run: |
          set -euo pipefail
          for f in "kkk.yml" "666.yml" "trigger.yml"; do
            if [ -f ".github/workflows/$f" ]; then
              cp ".github/workflows/$f" "${RUNNER_TEMP}/${f}.bak"
              echo "已备份 $f"
            fi
          done

      - name: 获取上游最新同步器
        shell: bash
        run: |
          set -euo pipefail
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch upstream "${UPSTREAM_BRANCH}" --prune
          SYNC_SCRIPT="${RUNNER_TEMP}/openwrt-auto-sync-upstream.sh"
          git show "upstream/${UPSTREAM_BRANCH}:common/sync-upstream.sh" > "${SYNC_SCRIPT}"
          chmod +x "${SYNC_SCRIPT}"
          bash -n "${SYNC_SCRIPT}"
          echo "最新同步器已加载：${SYNC_SCRIPT}"

      - name: 执行上游同步
        shell: bash
        run: |
          set -euo pipefail
          bash "${RUNNER_TEMP}/openwrt-auto-sync-upstream.sh"

      - name: 恢复自定义文件并清理不需要的 workflow 和 build 目录
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          HAS_CHANGES=false
          
          # 1. 恢复自定义文件 (kkk, 666, trigger)
          for f in "kkk.yml" "666.yml" "trigger.yml"; do
            if [ -f "${RUNNER_TEMP}/${f}.bak" ]; then
              mkdir -p .github/workflows
              cp "${RUNNER_TEMP}/${f}.bak" ".github/workflows/$f"
              echo "已恢复 $f"
              HAS_CHANGES=true
            fi
          done
          
          # 2. 删除不需要的 workflow 文件
          FILES_TO_DELETE=(
            ".github/workflows/Lienol.yml"
            ".github/workflows/Mt798x.yml"
            ".github/workflows/Official.yml"
            ".github/workflows/Xwrt.yml"
            ".github/workflows/update-adguardhome-api-cache.yml"
            ".github/workflows/validate.yml"
          )
          
          for file in "${FILES_TO_DELETE[@]}"; do
            if [ -f "$file" ]; then
              echo "正在删除文件: $file"
              rm -f "$file"
              HAS_CHANGES=true
            fi
          done
          
          # 3. 删除不需要的 build 目录
          DIRS_TO_DELETE=(
            "build/Lienol"
            "build/Mt798x"
            "build/Official"
            "build/Xwrt"
          )
          
          for dir in "${DIRS_TO_DELETE[@]}"; do
            if [ -d "$dir" ]; then
              echo "正在删除目录: $dir"
              rm -rf "$dir"
              HAS_CHANGES=true
            fi
          done
          
          # 4. 提交并推送
          if [ "$HAS_CHANGES" = true ]; then
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: 恢复自定义 workflow (666, kkk, trigger)，清理无效配置"
              CURRENT_BRANCH="${GITHUB_REF_NAME:-$(git branch --show-current)}"
              git push origin "HEAD:${CURRENT_BRANCH}"
              echo "清理完成并已推送。"
            else
              echo "文件内容与提交前一致，无需提交。"
            fi
          else
            echo "没有需要恢复或删除的文件。"
          fi

      - name: 上传自定义配置备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-backup
          path: ${{ runner.temp }}/openwrt-auto-sync/custom-backup.tar.gz
          if-no-files-found: ignore
          retention-days: 7