name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: datout/Openwrt-Auto
  UPSTREAM_BRANCH: main

jobs:
  sync:
    if: github.repository != 'datout/Openwrt-Auto'
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: 备份自定义文件
        shell: bash
        run: |
          set -e
          ts=$(date -u +%Y%m%d_%H%M%S)
          mkdir -p backups/auto_sync
          shopt -s nullglob
          # 精准备份：只备份 Immortalwrt 和 Lede 的配置，当前脚本，以及你的 kkk.yml
          tar -czf "backups/auto_sync/custom-backup-${ts}.tar.gz" \
            build/Immortalwrt/diy-part.sh \
            build/Immortalwrt/settings.ini \
            build/Immortalwrt/seed \
            build/Lede/diy-part.sh \
            build/Lede/settings.ini \
            build/Lede/seed \
            common/custom \
            .github/workflows/sync-upstream.yml \
            .github/workflows/kkk.yml \
            2>/dev/null || true
          shopt -u nullglob
          echo "BACKUP_FILE=backups/auto_sync/custom-backup-${ts}.tar.gz" >> $GITHUB_ENV

      - name: 上传自定义文件备份
        uses: actions/upload-artifact@v7
        with:
          name: custom-backup
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: ignore

      - name: 强制拉取并剔除多余文件夹
        shell: bash
        run: |
          set -euxo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream "${UPSTREAM_BRANCH}" --prune

          git checkout "${DEFAULT_BRANCH}"
          
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          # 1. 强制将本地硬重置为上游最新代码（彻底告别合并冲突）
          git reset --hard "upstream/${UPSTREAM_BRANCH}"

          # 2. 🌟 物理删除不需要的 4 个源码文件夹
          rm -rf build/Lienol
          rm -rf build/Mt798x
          rm -rf build/Official
          rm -rf build/Xwrt
          
          # 3. 🌟 物理删除 workflows 里对应的 4 个无用启动文件
          rm -f .github/workflows/Lienol.yml
          rm -f .github/workflows/Mt798x.yml
          rm -f .github/workflows/Official.yml
          rm -f .github/workflows/Xwrt.yml

          # 4. 恢复你备份的自定义文件（精准恢复，且包含 kkk.yml）
          if [ -f "${BACKUP_FILE}" ]; then
            tar -xzf "${BACKUP_FILE}" -C . || true
            git add build/Immortalwrt/diy-part.sh build/Immortalwrt/settings.ini build/Immortalwrt/seed \
                    build/Lede/diy-part.sh build/Lede/settings.ini build/Lede/seed \
                    common/custom .github/workflows/sync-upstream.yml .github/workflows/kkk.yml 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "restore custom files after upstream sync"
            fi
          fi

          # 5. 提交删除多余文件的操作
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove unused build dirs and workflows"
          fi

          # 6. 强制推送到你的仓库
          git push origin "${DEFAULT_BRANCH}" --force