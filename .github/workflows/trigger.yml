name: 定时触发 Immortalwrt 编译

on:
  schedule:
    # 每月 1, 7, 13, 19, 25 号的 UTC 18:35 (北京时间凌晨 2:35)
    # 这符合你“每 6 天一次”的需求
    - cron: '35 18 1,7,13,19,25 * *'
  workflow_dispatch: # 保留手动触发，方便你随时测试

jobs:
  trigger:
    runs-on: ubuntu-22.04
    steps:
      - name: 使用 API 触发 Immortalwrt.yml 编译
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "正在触发 Immortalwrt 编译..."
          gh workflow run Immortalwrt.yml \
            --repo "$REPO" \
            --ref "${{ github.ref_name }}" \
            -f REPO_BRANCH="openwrt-24.10" \
            -f CONFIG_FILE="x86_64" \
            -f INFORMATION_NOTICE="关闭" \
            -f KEEP_WORKFLOWS="30" \
            -f KEEP_RELEASES="30" \
            -f SSH_ACTION="false" \
            -f UPLOAD_FIRMWARE="true" \
            -f UPLOAD_RELEASE="false" \
            -f CACHEWRTBUILD_SWITCH="true" \
            -f UPDATE_FIRMWARE_ONLINE="true"